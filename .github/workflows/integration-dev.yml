name: Integration Test Dev Branch with Server

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: MediaGarrd/MediaGarrd-Stack-Testing@main
        with:
          server-branch: dev
          client-branch: ${{ github.head_ref || github.ref_name }}
