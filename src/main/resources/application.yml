server:
  port: ${CLIENT_PORT:8081}

spring:
  task:
    scheduling:
      pool:
        size: 2
  web:
    resources:
      cache:
        period: 0

mediagarrd:
  client:
    state-file: ${CLIENT_STATE_FILE:/var/lib/mediagarrd/client/state.json}
    download-directory: ${CLIENT_DOWNLOAD_DIRECTORY:/var/lib/mediagarrd/downloads}
    pickup-interval: ${CLIENT_PICKUP_INTERVAL:PT12H}
    server-port: ${MEDIAGARRD_SERVER_PORT:38471}
    preferred-server-ip: ${MEDIAGARRD_SERVER_IP:}
    update-repository: ${MEDIAGARRD_UPDATE_REPOSITORY:MediaGarrd/Client}
    github-api-base-url: ${MEDIAGARRD_GITHUB_API_URL:https://api.github.com}
    update-check-interval: ${MEDIAGARRD_UPDATE_CHECK_INTERVAL:PT24H}
    backup-run-timeout: ${CLIENT_BACKUP_RUN_TIMEOUT:PT6H}
